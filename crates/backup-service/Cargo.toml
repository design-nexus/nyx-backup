[package]
name = "backup-service"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
nyx-sync.workspace = true
backup-core.workspace = true
backup-system.workspace = true
backup-engine.workspace = true
backup-restore.workspace = true
libc.workspace = true
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net", "io-util"] }
clap = { version = "4", features = ["derive"] }
rpassword = "7"

[[bin]]
name = "nyx-backupd"
path = "src/daemon.rs"
[[bin]]
name = "nyx-backupctl"
path = "src/cli.rs"
