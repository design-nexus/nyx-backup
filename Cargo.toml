[workspace]
resolver = "3"
members = ["apps/backup", "crates/*"]
default-members = ["crates/backup-core", "crates/backup-system", "crates/backup-engine", "crates/backup-service", "crates/backup-restore", "crates/backup-migrate"]
[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-backup"
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
fs2 = "0.4"
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "9dc196245bbf0ccc93b8bf04ac61bb476b85e4d5", default-features = false }
nyx-sync = { git = "https://github.com/design-nexus/nyx-core.git", rev = "9dc196245bbf0ccc93b8bf04ac61bb476b85e4d5" }
backup-core = { path = "crates/backup-core" }
backup-system = { path = "crates/backup-system" }
backup-engine = { path = "crates/backup-engine" }
backup-service = { path = "crates/backup-service" }
backup-restore = { path = "crates/backup-restore" }
backup-migrate = { path = "crates/backup-migrate" }
[profile.release]
lto = "thin"
strip = true
